async function deriveKey(pw) {

  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },

async function go() {

function autoLogin() {
  (async () => {

      const key = await crypto.subtle.importKey("raw", b64(stored), { name: "AES-GCM" }, true, ["decrypt"]);

      show(html);
